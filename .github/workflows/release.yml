name: Release

on:
  push:
    branches: [master]

  workflow_dispatch:
    inputs:
      version:
        description: Version expected on master
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'svetam/rspec-multicore' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Read and validate version
        id: version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          CORE_VERSION=$(ruby -Irspec-multicore/lib -e 'require "rspec/multicore/version"; puts RSpec::Multicore::VERSION')
          RAILS_VERSION=$(ruby -Irspec-multicore-rails/lib -e 'require "rspec/multicore/rails/version"; puts RSpec::Multicore::Rails::VERSION')

          if [ "$CORE_VERSION" != "$RAILS_VERSION" ]; then
            echo "Version mismatch: core=$CORE_VERSION rails=$RAILS_VERSION" >&2
            exit 1
          fi

          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$CORE_VERSION" ]; then
            echo "Requested version $EXPECTED_VERSION does not match master version $CORE_VERSION" >&2
            exit 1
          fi

          for CHANGELOG in CHANGELOG.md rspec-multicore/CHANGELOG.md rspec-multicore-rails/CHANGELOG.md; do
            if ! grep -Fq "## $CORE_VERSION" "$CHANGELOG"; then
              echo "$CHANGELOG has no entry for $CORE_VERSION" >&2
              exit 1
            fi
          done

          if ! git rev-parse --verify --quiet "refs/tags/v$CORE_VERSION"; then
            LATEST_VERSION=$(git tag --list 'v*' | ruby -rrubygems -e '
              versions = $stdin.each_line.filter_map do |tag|
                value = tag.strip.delete_prefix("v")
                Gem::Version.new(value) unless value.empty?
              end
              puts versions.max if versions.any?
            ')

            if [ -n "$LATEST_VERSION" ]; then
              ruby -rrubygems -e '
                candidate = Gem::Version.new(ARGV.fetch(0))
                latest = Gem::Version.new(ARGV.fetch(1))
                abort "Version #{candidate} must be newer than #{latest}" unless candidate > latest
              ' "$CORE_VERSION" "$LATEST_VERSION"
            fi
          fi

          echo "version=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$CORE_VERSION" >> "$GITHUB_OUTPUT"
          ruby -rrubygems -e 'puts "prerelease=#{Gem::Version.new(ARGV.fetch(0)).prerelease?}"' "$CORE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build core gem
        working-directory: rspec-multicore
        run: |
          mkdir -p ../pkg
          gem build rspec-multicore.gemspec \
            --output "../pkg/rspec-multicore-${{ steps.version.outputs.version }}.gem"

      - name: Build Rails gem
        working-directory: rspec-multicore-rails
        run: |
          gem build rspec-multicore-rails.gemspec \
            --output "../pkg/rspec-multicore-rails-${{ steps.version.outputs.version }}.gem"

      - name: Validate package metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ruby -rrubygems/package -e '
            version = Gem::Version.new(ENV.fetch("VERSION"))
            core = Gem::Package.new("pkg/rspec-multicore-#{version}.gem").spec
            rails = Gem::Package.new("pkg/rspec-multicore-rails-#{version}.gem").spec

            abort "Unexpected core package" unless core.name == "rspec-multicore" && core.version == version
            abort "Unexpected Rails package" unless rails.name == "rspec-multicore-rails" && rails.version == version

            dependency = rails.dependencies.find { |entry| entry.name == "rspec-multicore" }
            expected = Gem::Requirement.new("= #{version}")
            abort "Rails must depend on rspec-multicore #{expected}" unless dependency&.requirement == expected
          '

      - name: Check published gems
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ruby -rjson -rnet/http -e '
            versions = %w[rspec-multicore rspec-multicore-rails].to_h do |name|
              response = Net::HTTP.get_response(URI("https://rubygems.org/api/v1/versions/#{name}.json"))
              abort "RubyGems API failed for #{name}: #{response.code}" unless response.is_a?(Net::HTTPSuccess)
              published = JSON.parse(response.body).any? { |entry| entry.fetch("number") == ENV.fetch("VERSION") }
              [name, published]
            end

            puts "core=#{versions.fetch("rspec-multicore")}"
            puts "rails=#{versions.fetch("rspec-multicore-rails")}"
            puts "missing=#{versions.value?(false)}"
          ' >> "$GITHUB_OUTPUT"

      - name: Configure RubyGems credentials
        if: steps.published.outputs.missing == 'true'
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push gems to RubyGems.org
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CORE_PUBLISHED: ${{ steps.published.outputs.core }}
          RAILS_PUBLISHED: ${{ steps.published.outputs.rails }}
        run: |
          if [ "$CORE_PUBLISHED" = "true" ]; then
            echo "rspec-multicore $VERSION is already published"
          else
            gem push "pkg/rspec-multicore-$VERSION.gem"
          fi

          if [ "$RAILS_PUBLISHED" = "true" ]; then
            echo "rspec-multicore-rails $VERSION is already published"
          else
            gem push "pkg/rspec-multicore-rails-$VERSION.gem"
          fi

      - name: Verify published gems
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            ruby -rjson -rnet/http -e '
              missing = %w[rspec-multicore rspec-multicore-rails].reject do |name|
                response = Net::HTTP.get_response(URI("https://rubygems.org/api/v1/versions/#{name}.json"))
                unless response.is_a?(Net::HTTPSuccess)
                  warn "RubyGems API failed for #{name}: #{response.code}"
                  exit 2
                end
                JSON.parse(response.body).any? { |entry| entry.fetch("number") == ENV.fetch("VERSION") }
              end

              if missing.empty?
                puts "All gems are published"
              else
                warn "Waiting for RubyGems propagation: #{missing.join(", ")} #{ENV.fetch("VERSION")} missing"
                exit 1
              end
            '
            status=$?

            if [ "$status" -eq 0 ]; then
              exit 0
            elif [ "$status" -eq 2 ]; then
              exit 1
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "RubyGems did not show all published gems after 5 minutes" >&2
              exit 1
            fi

            sleep 10
          done

      - name: Create Git tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "$TAG points to $TAG_COMMIT, expected $GITHUB_SHA" >&2
              exit 1
            fi
            echo "$TAG already points to the release commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

      - name: Verify complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "$TAG points to $TAG_COMMIT, expected $GITHUB_SHA" >&2
            exit 1
          fi

          gh release view "$TAG" >/dev/null
