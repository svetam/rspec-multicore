name: CI

on:
  push:
    branches:
      - develop
      - master

  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.gem }} on Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.path }}/Gemfile
    strategy:
      fail-fast: false
      matrix:
        gem: [rspec-multicore, rspec-multicore-rails]
        include:
          - gem: rspec-multicore
            path: rspec-multicore
          - gem: rspec-multicore-rails
            path: rspec-multicore-rails
        os: [ubuntu-latest, macos-latest]
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      
      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: |
          bundle exec rake spec
          bundle exec rubocop --cache false

  core-contract:
    runs-on: ubuntu-latest
    name: rspec-multicore / RSpec Core ${{ matrix.rspec-core }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/rspec-multicore/Gemfile
      RSPEC_CORE_VERSION: ${{ matrix.rspec-core }}
    strategy:
      fail-fast: false
      matrix:
        rspec-core: ["3.13.0", "~> 3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - working-directory: rspec-multicore
        run: bundle install
      - working-directory: rspec-multicore
        run: bundle exec rake spec

  rails-contract:
    runs-on: ubuntu-latest
    name: rspec-multicore-rails / Rails ${{ matrix.rails }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/rspec-multicore-rails/Gemfile
      RAILS_VERSION: ${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        rails: ["~> 7.1", "~> 8.0"]

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - working-directory: rspec-multicore-rails
        run: bundle install
      - working-directory: rspec-multicore-rails
        run: bundle exec rake spec

  required-compatibility:
    runs-on: ubuntu-latest
    name: Required third-party compatibility
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/compatibility/required/Gemfile

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - working-directory: compatibility/required
        run: bundle exec rake spec
      - name: Verify checkout
        if: always()
        run: |
          git status --short
          test -z "$(git status --porcelain)"

  release-readiness:
    runs-on: ubuntu-latest
    name: Release readiness

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          CORE_VERSION=$(ruby -Irspec-multicore/lib -e 'require "rspec/multicore/version"; puts RSpec::Multicore::VERSION')
          RAILS_VERSION=$(ruby -Irspec-multicore-rails/lib -e 'require "rspec/multicore/rails/version"; puts RSpec::Multicore::Rails::VERSION')

          if [ "$CORE_VERSION" != "$RAILS_VERSION" ]; then
            echo "Version mismatch: core=$CORE_VERSION rails=$RAILS_VERSION" >&2
            exit 1
          fi

          for CHANGELOG in CHANGELOG.md rspec-multicore/CHANGELOG.md rspec-multicore-rails/CHANGELOG.md; do
            if ! grep -Fq "## $CORE_VERSION" "$CHANGELOG"; then
              echo "$CHANGELOG has no entry for $CORE_VERSION" >&2
              exit 1
            fi
          done

          TAG_EXISTS=false
          if git rev-parse --verify --quiet "refs/tags/v$CORE_VERSION"; then
            TAG_EXISTS=true
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "master" ]; then
            if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
              echo "Release PRs must originate from $REPOSITORY:develop" >&2
              exit 1
            fi

            if [ "$TAG_EXISTS" = "true" ]; then
              echo "v$CORE_VERSION is already released" >&2
              exit 1
            fi
          fi

          if [ "$TAG_EXISTS" = "false" ]; then
            LATEST_VERSION=$(git tag --list 'v*' | ruby -rrubygems -e '
              versions = $stdin.each_line.filter_map do |tag|
                value = tag.strip.delete_prefix("v")
                Gem::Version.new(value) unless value.empty?
              end
              puts versions.max if versions.any?
            ')

            if [ -n "$LATEST_VERSION" ]; then
              ruby -rrubygems -e '
                candidate = Gem::Version.new(ARGV.fetch(0))
                latest = Gem::Version.new(ARGV.fetch(1))
                abort "Version #{candidate} must be newer than #{latest}" unless candidate > latest
              ' "$CORE_VERSION" "$LATEST_VERSION"
            fi
          fi

          echo "version=$CORE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build core gem
        working-directory: rspec-multicore
        run: |
          mkdir -p ../pkg
          gem build rspec-multicore.gemspec \
            --output "../pkg/rspec-multicore-${{ steps.version.outputs.version }}.gem"

      - name: Build Rails gem
        working-directory: rspec-multicore-rails
        run: |
          gem build rspec-multicore-rails.gemspec \
            --output "../pkg/rspec-multicore-rails-${{ steps.version.outputs.version }}.gem"

      - name: Validate package metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ruby -rrubygems/package -e '
            version = Gem::Version.new(ENV.fetch("VERSION"))
            core = Gem::Package.new("pkg/rspec-multicore-#{version}.gem").spec
            rails = Gem::Package.new("pkg/rspec-multicore-rails-#{version}.gem").spec

            abort "Unexpected core package" unless core.name == "rspec-multicore" && core.version == version
            abort "Unexpected Rails package" unless rails.name == "rspec-multicore-rails" && rails.version == version

            dependency = rails.dependencies.find { |entry| entry.name == "rspec-multicore" }
            expected = Gem::Requirement.new("= #{version}")
            abort "Rails must depend on rspec-multicore #{expected}" unless dependency&.requirement == expected
          '

  ci:
    runs-on: ubuntu-latest
    name: CI
    if: always()
    needs: [test, core-contract, rails-contract, required-compatibility, release-readiness]

    steps:
      - name: Verify required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          CORE_CONTRACT_RESULT: ${{ needs.core-contract.result }}
          RAILS_CONTRACT_RESULT: ${{ needs.rails-contract.result }}
          REQUIRED_COMPATIBILITY_RESULT: ${{ needs.required-compatibility.result }}
          RELEASE_READINESS_RESULT: ${{ needs.release-readiness.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] || \
             [ "$CORE_CONTRACT_RESULT" != "success" ] || \
             [ "$RAILS_CONTRACT_RESULT" != "success" ] || \
             [ "$REQUIRED_COMPATIBILITY_RESULT" != "success" ] || \
             [ "$RELEASE_READINESS_RESULT" != "success" ]; then
            echo "One or more required CI jobs failed" >&2
            exit 1
          fi
